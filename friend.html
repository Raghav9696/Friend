<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Friend? 🤝✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dff6ff, #f7fbff);
      font-family: Arial, sans-serif;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      padding: 36px 28px;
      border-radius: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      max-width: 430px;
      width: 100%;
      position: relative;
      border: 1px solid rgba(0,0,0,0.04);
    }

    .sparkle {
      position: absolute;
      font-size: 1.6rem;
      animation: float 4s ease-in-out infinite;
      opacity: 0.5;
      pointer-events: none;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    h1 {
      color: #126782;
      font-size: 1.9rem;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    p {
      color: #4a4a4a;
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 22px;
      position: relative;
      min-height: 58px;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
    }

    #yesBtn {
      background-color: #2a9d8f;
      color: white;
      box-shadow: 0 5px 15px rgba(42, 157, 143, 0.28);
    }

    #yesBtn:hover {
      transform: scale(1.06);
      background-color: #21867a;
    }

    #noBtn {
      background-color: #f2f2f2;
      color: #333;
      position: absolute;
      right: 40px;
    }

    .friend-screen {
      display: none;
    }

    .friend-screen h2 {
      color: #126782;
      font-size: 1.9rem;
      margin-bottom: 14px;
    }

    .friend-screen .message {
      background: #f8fcff;
      border: 1px solid #e6f3fb;
      border-radius: 16px;
      padding: 16px 14px;
      text-align: left;
      margin-top: 14px;
      color: #3f4a4f;
      line-height: 1.7;
    }

    .small-note {
      margin-top: 12px;
      font-size: 0.92rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <!-- Question card (no image) -->
  <div class="card" id="questionCard">
    <h1 id="questionText">Kya tum meri friend banogi? 🤝💙</h1>
    <p>Bas ek simple sa question hai — kya hum achhe friends ban sakte hain?</p>
    <div class="btn-container">
      <button id="yesBtn">Yes! 😊</button>
      <button id="noBtn">No 🤭</button>
    </div>
  </div>

  <!-- Friend screen (image still there, can keep it or also remove later) -->
  <div class="card friend-screen" id="friendCard">
    <div class="gif-container">
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Friends">
    </div>
    <h2>Yayyy! Thanks for saying yes 🎉</h2>
    <div class="message" id="friendMessage"></div>
    <div class="small-note">Friendship start ho gayi ✨</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionCard = document.getElementById('questionCard');
    const friendCard = document.getElementById('friendCard');
    const friendMessage = document.getElementById('friendMessage');

    function moveNoButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 60);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 60);
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.right = 'auto';
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      questionCard.style.display = 'none';
      friendCard.style.display = 'block';
      friendMessage.innerHTML =
        `I’m really happy that you said yes. I hope we can become good friends, share small happy moments, talk comfortably, and support each other with kindness and respect. A simple friendship like this can be really special, and I’d be glad to have that with you.`;
      createSparkles();
    });

    function createSparkles() {
      for (let i = 0; i < 24; i++) {
        const star = document.createElement('div');
        star.classList.add('sparkle');
        star.innerHTML = '✨';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.fontSize = (Math.random() * 18 + 16) + 'px';
        star.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(star);
      }
    }
  </script>
</body>
</html>
